quarkus.application.name=quarkus-weather

# Outside the 8050-8081 range the microservices modules occupy.
quarkus.http.port=8095

# weather.html deliberately starts the Claude toggle disabled and assistant.js enables it only
# when the configured form exists. Do not let a deployment combine fresh HTML with an older
# cached script, because the old script would leave the otherwise usable toggle disabled.
quarkus.http.filter.assistant-script.header."Cache-Control"=no-store
quarkus.http.filter.assistant-script.matches=/assistant.js

quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
# Explicit timeouts: without them a stalled upstream would hang the request thread indefinitely.
quarkus.rest-client.open-meteo.connect-timeout=2000
quarkus.rest-client.open-meteo.read-timeout=5000
# Open-Meteo resets pooled connections after roughly 30 seconds of inactivity. Evict them first
# to avoid a harmless Vert.x "Connection reset" error while still reusing one connection for the
# three city requests that make up a dashboard refresh.
quarkus.rest-client.open-meteo.connection-ttl=25000

# The dashboard is the only page; keep startup logging quiet but keep client failures visible.
quarkus.log.category."dev.nklip.javacraft.weather".level=INFO

# Anthropic API key, read from the environment (or the gitignored .envrc in dev).
# The empty default is deliberate: an absent key is a supported state — the dashboard
# renders the Claude panel disabled rather than failing to start. Never put the key here.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5
anthropic.max-tokens=16000
# Thinking is on by default for this model and counts against max-tokens, so the ceiling
# above is sized for reasoning + answer, not the answer alone.
anthropic.effort=medium
