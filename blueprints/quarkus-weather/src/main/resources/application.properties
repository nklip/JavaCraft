quarkus.application.name=quarkus-weather

# Outside the 8050-8081 range the microservices modules occupy.
quarkus.http.port=8095

quarkus.rest-client.open-meteo.url=https://api.open-meteo.com
# Explicit timeouts: without them a stalled upstream would hang the request thread indefinitely.
quarkus.rest-client.open-meteo.connect-timeout=2000
quarkus.rest-client.open-meteo.read-timeout=5000

# The dashboard is the only page; keep startup logging quiet but keep client failures visible.
quarkus.log.category."dev.nklip.javacraft.weather".level=INFO
