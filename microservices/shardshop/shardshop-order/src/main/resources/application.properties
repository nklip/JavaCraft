quarkus.config.locations=${shardshop.routing.config:file:/etc/shardshop/routing/application.properties}
%test.quarkus.config.locations=routing-test.properties
%test.shardshop.id.generator-id=1
%test.shardshop.order.cdc.enabled=false
%test.shardshop.order.results.enabled=false
%test.shardshop.order.profit.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false
quarkus.http.limits.max-body-size=256K
quarkus.http.read-timeout=10s
# HTTP/2 qualification and request balancing belong to PLAN step 6.8.
quarkus.http.http2=false
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
# Deploy page markup and assets together without stale cached versions.
quarkus.http.static-resources.caching-enabled=false
quarkus.http.filter.order-page.matches=/orders/.*
quarkus.http.filter.order-page.header.Cache-Control=no-store
