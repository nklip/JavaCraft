# JBoss Log Manager configuration of the Cucumber JVM. The applications under test write their own log files.
loggers=org.flywaydb,org.testcontainers,tc,com.github.dockerjava
logger.level=INFO
logger.handlers=CONSOLE
# Flyway logs each applied migration of each scenario database; failures still reach the scenario result.
logger.org.flywaydb.level=WARN
logger.org.testcontainers.level=INFO
logger.tc.level=INFO
logger.com.github.dockerjava.level=WARN

handler.CONSOLE=org.jboss.logmanager.handlers.ConsoleHandler
handler.CONSOLE.formatter=PATTERN
handler.CONSOLE.properties=autoFlush,target
handler.CONSOLE.autoFlush=true
handler.CONSOLE.target=SYSTEM_OUT

formatter.PATTERN=org.jboss.logmanager.formatters.PatternFormatter
formatter.PATTERN.properties=pattern
formatter.PATTERN.pattern=%d{HH:mm:ss,SSS} %-5p [%c{1.}] %s%e%n
