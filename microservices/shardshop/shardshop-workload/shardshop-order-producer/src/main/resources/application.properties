%test.shardshop.producer.product-url=http://127.0.0.1:1
%test.shardshop.producer.order-url=http://127.0.0.1:1
%test.shardshop.producer.run-name=unit-test
# The control page and its API (step 4.13). The REST root names the workload; the page is /workload-order-producer/.
quarkus.rest.path=/api/v1/order-producer
quarkus.http.limits.max-body-size=1K
quarkus.http.read-timeout=5s
# Deploy page markup and assets together without stale cached versions; the status changes at each request.
quarkus.http.static-resources.caching-enabled=false
quarkus.http.filter.control-page.matches=/(workload-order-producer|workload-control|api)/.*
quarkus.http.filter.control-page.header.Cache-Control=no-store
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
