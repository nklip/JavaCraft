%test.shardshop.seeder.product-url=http://127.0.0.1:1
%test.shardshop.seeder.max-attempts=1
# The control page and its API (step 4.13). The REST root names the workload; the page is /workload-product-seeder/.
quarkus.rest.path=/api/v1/product-seeder
# The bootstrap Job serves no HTTP; only the interactive mode listens.
quarkus.http.host-enabled=${shardshop.seeder.interactive:false}
%test.quarkus.http.host-enabled=true
quarkus.http.limits.max-body-size=1K
quarkus.http.read-timeout=5s
# Deploy page markup and assets together without stale cached versions; the status changes at each request.
quarkus.http.static-resources.caching-enabled=false
quarkus.http.filter.control-page.matches=/(workload-product-seeder|workload-control|api)/.*
quarkus.http.filter.control-page.header.Cache-Control=no-store
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
