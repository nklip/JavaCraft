%test.shardshop.reader.product-url=http://127.0.0.1:8080
# Apache HttpClient logs each repeated request at INFO. The read reports count these failures, and the catalog wait
# logs one line for each repeat.
quarkus.log.category."org.apache.hc.client5.http.impl.classic.HttpRequestRetryExec".level=WARN
# The control page and its API (step 4.13). The REST root names the workload; the page is /workload-product-reader/.
quarkus.rest.path=/api/v1/product-reader
quarkus.http.limits.max-body-size=1K
quarkus.http.read-timeout=5s
# Deploy page markup and assets together without stale cached versions; the status changes at each request.
quarkus.http.static-resources.caching-enabled=false
quarkus.http.filter.control-page.matches=/(workload-product-reader|workload-control|api)/.*
quarkus.http.filter.control-page.header.Cache-Control=no-store
%test.quarkus.http.port=0
%test.quarkus.http.test-port=0
