# Opt-in, single-shard maintenance through V7. Stop legacy readers and writers first.
# Keep existing SQL/checksums and the short lock-acquisition bound. See database/RUNBOOK.md.
flyway.schemas=catalog
flyway.defaultSchema=catalog
flyway.table=flyway_schema_history
flyway.locations=filesystem:/flyway/sql
flyway.target=7
flyway.createSchemas=false
flyway.validateMigrationNaming=true
flyway.failOnMissingLocations=true
flyway.cleanDisabled=true
flyway.lockRetryCount=5
flyway.connectRetries=2
flyway.connectRetriesInterval=1
flyway.jdbcProperties.connectTimeout=5
flyway.jdbcProperties.socketTimeout=150
flyway.jdbcProperties.options=-c role=catalog_owner -c statement_timeout=120000 -c lock_timeout=5000
