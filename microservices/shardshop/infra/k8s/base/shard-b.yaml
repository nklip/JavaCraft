apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shard-b
  namespace: shardshop
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:28d95c3797e8ec648b240a48745f700ecb7a307b91c8b1fbb3ad83e5b25a3048
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: shardshop
      owner: shardshop_owner
      # CNPG generates shard-b-app credentials at runtime; never commit passwords.
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      # Step 2.1 measured tiny-data use; remeasure when application load arrives.
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
    parameters:
      synchronous_commit: "on"
      wal_level: logical
      hot_standby_feedback: "on"
      sync_replication_slots: "on"
      # Two physical slots plus CDC, with headroom for bootstrap/recovery.
      max_replication_slots: "10"
      max_wal_senders: "10"
      # Small lab PVCs: bound retained WAL while leaving room for the data set.
      max_wal_size: 256MB
      min_wal_size: 80MB
      max_slot_wal_keep_size: 512MB
      # HA slots retain WAL for standbys; keep a small floor, not CNPG's 512MB default.
      wal_keep_size: 128MB
  replicationSlots:
    highAvailability:
      enabled: true
      synchronizeLogicalDecoding: true
