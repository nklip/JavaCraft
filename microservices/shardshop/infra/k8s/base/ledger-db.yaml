apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ledger-db
  namespace: shardshop
spec:
  # Separate storage from the shared shards; one instance has no failover target.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:28d95c3797e8ec648b240a48745f700ecb7a307b91c8b1fbb3ad83e5b25a3048
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: ledger
      owner: ledger_owner
      # CNPG generates ledger-db-app at runtime. Runtime grants arrive in step 2.5.
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      # Match the measured tiny-data baseline; remeasure with ledger workloads.
      memory: 512Mi
  postgresql:
    parameters:
      # Ledger outbox polling needs no logical decoding or standby acknowledgements.
      wal_level: replica
      max_wal_size: 256MB
      min_wal_size: 80MB
      wal_keep_size: "0"
