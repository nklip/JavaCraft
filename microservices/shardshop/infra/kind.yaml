# kind-only cluster configuration: one control plane and two workers on the
# digest-pinned Kubernetes 1.36.4 node image, with the API server on loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shardshop
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    image: docker.io/kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: docker.io/kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: docker.io/kindest/node@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
