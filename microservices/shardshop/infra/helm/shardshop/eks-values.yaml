# Storage, placement, durability and secret settings for the EKS foundation of
# infra/terraform: one worker group in each of three zones. The runbook in
# infra/terraform/README.md sets the ECR copy of the Flyway image and the backup bucket,
# because their names contain the AWS account ID.
orderProducer:
  runName: eks-saga-v1

storageClass:
  name: shardshop-gp3
  provisioner: ebs.csi.aws.com
  parameters:
    type: gp3
    encrypted: "true"
    # The destroy check finds a volume that a claim leaves by this tag.
    tagSpecification_1: Project=shardshop

postgresql:
  storage:
    storageClass: shardshop-gp3
  affinity:
    # One instance of each shard in each zone. An EBS volume stays in its zone.
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone

# Continuous WAL archiving and a daily base backup of each database cluster.
backup:
  endpointURL: https://s3.eu-west-2.amazonaws.com
  region: eu-west-2
  retentionPolicy: 7d
  schedule: "0 0 3 * * *"

# Terraform reads this list and creates one AWS Secrets Manager secret for each role,
# and one for the broker.
runtimeSecrets:
  prefix: shardshop/
  region: eu-west-2
  databaseRoles:
    - catalog_migrator
    - ordering_migrator
    - product_app
    - order_app
    - ordering_operator
    - ordering_cdc
    - ledger_migrator
    - ledger_app

# Three brokers, one in each zone. Each quorum queue has a member on each broker.
rabbitmq:
  replicas: 3
  storage:
    storageClass: shardshop-gp3
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: shardshop-rabbitmq
          topologyKey: topology.kubernetes.io/zone

# The public webpages of the AWS deployment (render=webpages). Terraform creates one Cognito group
# for each name. A member of a read group can open all five pages. Only a member of a write group
# can change a workload. The runbook adds securityGroup and access.
webpages:
  readGroups:
    - viewer
    - operator
  writeGroups:
    - operator
