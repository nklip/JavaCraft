# Appended only for several brokers. Since RabbitMQ 4.1 the -0 pod is the seed node, and the
# other brokers join it. The plugin then needs no Kubernetes API access.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
cluster_partition_handling = pause_minority
# The seed declares the quorum queues before the other brokers join. Each join then grows
# every quorum queue to target_group_size members, which the chart sets to the replica count.
quorum_queue.continuous_membership_reconciliation.enabled = true
