# Import public topology and Secret-backed users on every boot, including retained data.
definitions.import_backend = local_filesystem
definitions.local.path = /tmp/rabbitmq/definitions
definitions.skip_if_unchanged = false
listeners.tcp.default = 5672
management.tcp.port = 15672
vm_memory_high_watermark.absolute = 512MiB
disk_free_limit.absolute = 100MB
max_message_size = 1048576
heartbeat = 30
log.console = true
log.console.level = info
log.file = false
