{{- include "shardshop.validate" . -}}
{{- if eq .Values.render "namespace" }}
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/part-of: shardshop
    pod-security.kubernetes.io/enforce: restricted
{{- end }}
