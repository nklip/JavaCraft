{{- /* An environment without a suitable platform class (EKS) defines one. kind uses its own class. */ -}}
{{- if and (eq .Values.render "infrastructure") .Values.storageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name | quote }}
provisioner: {{ .Values.storageClass.provisioner | quote }}
parameters:
  {{- toYaml .Values.storageClass.parameters | nindent 2 }}
# The volume follows the zone of its scheduled instance, and the volume ends with its claim.
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
{{- end }}
