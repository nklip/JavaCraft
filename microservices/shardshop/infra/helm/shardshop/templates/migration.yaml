{{- if eq .Values.render "migration" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.migrationShard }}-catalog-migration
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: schema-migration
    app.kubernetes.io/component: catalog
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-migration
        app.kubernetes.io/component: catalog
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          image: {{ .Values.migration.image }}
          args: [-configFiles=/flyway/sql/flyway.toml, migrate]
          env:
            - name: SHARD_NAME
              value: {{ .Values.migrationShard | quote }}
            - name: FLYWAY_URL
              value: jdbc:postgresql://$(SHARD_NAME)-rw.{{ .Release.Namespace }}.svc:5432/shardshop?sslmode=verify-full&sslrootcert=/etc/flyway/ca.crt
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-migrator
                  key: username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-migrator
                  key: password
            - name: HOME
              value: /tmp
            - name: REDGATE_DISABLE_TELEMETRY
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
              readOnly: true
            - name: ca
              mountPath: /etc/flyway
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migrations
          configMap:
            name: catalog-migrations
        - name: ca
          secret:
            secretName: {{ .Values.migrationShard }}-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
