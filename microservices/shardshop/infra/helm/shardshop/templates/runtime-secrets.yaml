{{- /*
EKS: the AWS Secrets Store CSI provider copies the AWS Secrets Manager values into the
Kubernetes Secrets that kind provisions with cluster-create.sh. The driver keeps a synced
Secret only while a pod mounts its class, thus a minimal holder pod mounts it.
*/ -}}
{{- if and (eq .Values.render "infrastructure") .Values.runtimeSecrets }}
{{- $prefix := .Values.runtimeSecrets.prefix }}
{{- $objects := list }}
{{- $secrets := list }}
{{- range .Values.runtimeSecrets.databaseRoles }}
{{- $name := replace "_" "-" . }}
{{- $objects = append $objects (dict "objectName" (printf "%s%s" $prefix $name) "objectType" "secretsmanager"
      "jmesPath" (list (dict "path" "username" "objectAlias" (printf "%s-username" $name))
                       (dict "path" "password" "objectAlias" (printf "%s-password" $name)))) }}
{{- $secrets = append $secrets (dict "secretName" $name "type" "kubernetes.io/basic-auth"
      "data" (list (dict "objectName" (printf "%s-username" $name) "key" "username")
                   (dict "objectName" (printf "%s-password" $name) "key" "password"))) }}
{{- end }}
{{- $broker := list "users_json" "admin_password" "order_password" "ledger_password" "erlang_cookie" }}
{{- $paths := list }}
{{- $data := list }}
{{- range $broker }}
{{- $paths = append $paths (dict "path" . "objectAlias" (printf "rabbitmq-%s" .)) }}
{{- $data = append $data (dict "objectName" (printf "rabbitmq-%s" .) "key" (replace "_" "-" . | replace "users-json" "users.json")) }}
{{- end }}
{{- $objects = append $objects (dict "objectName" (printf "%srabbitmq" $prefix) "objectType" "secretsmanager" "jmesPath" $paths) }}
{{- $secrets = append $secrets (dict "secretName" "shardshop-rabbitmq" "type" "Opaque" "data" $data) }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shardshop-runtime-secrets
  namespace: {{ .Release.Namespace | quote }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.runtimeSecrets.region | quote }}
    usePodIdentity: "true"
    objects: |
      {{- toYaml $objects | nindent 6 }}
  secretObjects:
    {{- toYaml $secrets | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shardshop-runtime-secrets
  namespace: {{ .Release.Namespace | quote }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shardshop-runtime-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: shardshop-runtime-secrets
    app.kubernetes.io/part-of: shardshop
spec:
  replicas: 1
  # A new pod mounts the class before the old pod stops, thus the synced Secrets stay.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shardshop-runtime-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shardshop-runtime-secrets
        app.kubernetes.io/part-of: shardshop
    spec:
      serviceAccountName: shardshop-runtime-secrets
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- include "shardshop.podSecurity" . | nindent 6 }}
      containers:
        # The pinned PostgreSQL image is already on every node and has sleep.
        - name: holder
          image: {{ .Values.postgresql.image | quote }}
          command: [sleep, infinity]
          {{- include "shardshop.containerSecurity" . | nindent 10 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: shardshop-runtime-secrets
{{- end }}
