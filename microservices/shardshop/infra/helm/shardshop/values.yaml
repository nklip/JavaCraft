# cluster-create.sh provisions infrastructure; up.sh deploys migrations and applications through Helmfile.
render: infrastructure
migrationShard: ""
migrationStream: catalog
# Explicit run for standalone render=seeding and workload drills; Helm hooks use the release revision.
run: ""
# up.sh replaces this value on every deployment to restart application Deployments.
restartToken: ""
datasetVersion: catalog-v1
images:
  product: ""
  product-seeder: ""
  product-reader: ""
  order: ""
  ledger: ""
  order-producer: ""
shards: []

postgresql:
  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:28d95c3797e8ec648b240a48745f700ecb7a307b91c8b1fbb3ad83e5b25a3048
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      # Measured tiny-data baseline; remeasure when application load arrives.
      memory: 512Mi
  affinity: {}

shard:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  parameters:
    synchronous_commit: "on"
    wal_level: logical
    hot_standby_feedback: "on"
    sync_replication_slots: "on"
    max_replication_slots: "10"
    max_wal_senders: "10"
    max_wal_size: 256MB
    min_wal_size: 80MB
    max_slot_wal_keep_size: 512MB
    wal_keep_size: 128MB

ledger:
  parameters:
    wal_level: replica
    max_wal_size: 256MB
    min_wal_size: 80MB
    wal_keep_size: "0"

migration:
  image: docker.io/library/shardshop-flyway:13.8.1-openjdk25@sha256:96efa77525170d9eac45d4baa7027920da788a92b46bbbdc3f6a9b0443b32665
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 256Mi

# Resource budgets of the applications, measured on the lab. The 2-CPU limits avoid long
# CPU throttling while the JVMs start. Each product pod runs one JVM, which reserves its
# generator ID at startup.
product:
  # Additional literal application.properties settings; passwords remain Secret references.
  configuration: {}
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 512Mi

productSeeder:
  ttlSecondsAfterFinished: 86400
  # Literal HTTP client environment settings from the schema allowlist.
  configuration: {}
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "2"
      memory: 256Mi

productReader:
  configuration: {}
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "2"
      memory: 384Mi

# Initial saga budgets include three embedded Debezium readers in the order JVM.
# Step 4.9 lab peaks: order 358 MiB, ledger 158 MiB, producer 139 MiB.
order:
  configuration: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

ledgerApplication:
  configuration:
    # The schema requires USD and rejects EUR: the kind saga gate and drill need both outcomes.
    shardshop.ledger.allowed-currencies: USD
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 512Mi

orderProducer:
  # Required durable retry identity, independent of the Helm revision/restart token.
  # Keep this and the selection settings unchanged while replaying a retained run.
  # No $: SmallRye Config expands ${...} and rewrites the escapes $$ and \$.
  runName: ""
  configuration:
    SHARDSHOP_PRODUCER_REJECTED_ORDER_PERCENT: "10"
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "2"
      memory: 384Mi

# A single durable broker for the lab; the image starts directly under the selected UID.
rabbitmq:
  image: docker.io/library/rabbitmq:4.3.6-management@sha256:b575d00b4e309e1eacc68e772298af74fe0f5672fac5b46ba698ffef379f68f7
  replicas: 1
  runAsUser: 10001
  fsGroup: 10001
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
