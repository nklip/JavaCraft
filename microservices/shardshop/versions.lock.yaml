  status: resolved
  finding: Inherited framework, JUnit and Netty management, test agents/providers,
    plugin classpaths and test images required scoped qualification.
  resolution: Quarkus 3.40.1 and local properties agree; on 2026-10-04 all six
    effective POMs, resolved dependency graphs and SBOMs matched selected pins.
    No Spring runtime/test artifacts resolve. Inert parent/BOM compatibility entries
    are not dependencies. The three plugin-only XML prereleases are recorded in
    maven.plugin_prerelease_exception; other plugin security overrides are retained.
- id: SBOM-AND-RUNTIME
  blocks:
  - '4.9'
  status: open
  finding: Node inventory and advisory scan completed on 2026-09-28 (Docker Scout
    1.20.3); 160 OS binary packages; 597 indexed packages; 155 distinct advisories
    (10 critical, 42 high, 28 medium, 66 low, 9 unspecified), including containerd
    CVE-2026-53493. Broker/Maven/JDK/final application image qualification remains
    separate. On 2026-10-10 Docker Scout 1.24.0 indexed only 6 of the 12 Ubuntu
    packages that the application JRE base records in /usr/share/rocks/dpkg.query
    (/var/lib/chisel/manifest.wall records 11 of them, without the JRE package).
    Thus the step 3.9 inventory and gate do not
    examine glibc, the GCC runtime, base-files and base-passwd. OSV lists Ubuntu
    advisories for these images that Docker Scout does not report.
  evidence:
    checked_on: '2026-10-10'
    base_image_packages:
    - 'base-files 14ubuntu6.2'
    - 'base-passwd 3.6.8'
    - 'gcc-16-base 16-20260322-1ubuntu1'
    - 'libc6 2.43-2ubuntu2.4'
    - 'libgcc-s1 16-20260322-1ubuntu1'
    - 'libnspr4 2:4.38.2-1ubuntu1'
    - 'libnss3 2:3.120-1ubuntu2.1'
    - 'libpcsclite1 2.4.1-1'
    - 'libsqlite3-0 3.46.1-9ubuntu0.3'
    - 'libstdc++6 16-20260322-1ubuntu1'
    - 'zlib1g 1:1.3.dfsg+really1.3.1-1ubuntu3.1'
    - 'openjdk-25-jdk-headless 25.0.4.1+1-1~26.04.4'
    scout_indexed_sources: nspr, nss, openjdk-25, pcsc-lite, sqlite3 and zlib, all
      without an advisory
    not_indexed: libc6, libgcc-s1, libstdc++6, gcc-16-base, base-files and base-passwd
    osv_ubuntu_26_04:
    - {package: glibc, version: '2.43-2ubuntu2.4', advisories: [UBUNTU-CVE-2026-8674, UBUNTU-CVE-2026-18374, UBUNTU-CVE-2026-86805, UBUNTU-CVE-2026-89092, UBUNTU-CVE-2026-95818, UBUNTU-CVE-2026-97399]}
    - {package: openjdk-25, version: '25.0.4.1+1-1~26.04.4', advisories: [UBUNTU-CVE-2026-47057, UBUNTU-CVE-2026-47058, UBUNTU-CVE-2026-83357, UBUNTU-CVE-2026-83368, UBUNTU-CVE-2026-83408, UBUNTU-CVE-2026-94114, UBUNTU-CVE-2026-105111]}
    - {package: zlib, version: '1:1.3.dfsg+really1.3.1-1ubuntu3.1', advisories: [UBUNTU-CVE-2026-85091]}
    osv_without_advisory: gcc-16, base-files, base-passwd, nspr, nss, pcsc-lite and sqlite3
    osv_assessment: Ubuntu gives all 14 advisories the priority medium, and none has
      a 26.04 fix. The CVSS 3.1 vectors give a high base score (7.0-8.1) to
      UBUNTU-CVE-2026-47057, -47058, -83357, -83368, -83408 and -85091. No reviewed
      statement covers them.
    source_refs:
    - https://osv.dev/
    - https://ubuntu.com/security/cves
  resolution: Node findings accepted by the user on 2026-09-28 for the loopback-only,
    disposable local lab; recheck when the kind node image changes. Complete the
    application image inventories and advisory checks in step 3.9. Do not infer
    support from enclosing BOM/JDK. Maven boundaries remain unchanged. On 2026-10-10
    the product, seeder and reader images passed the critical/high gate with reviewed
    OpenVEX statements (images.shardshop_applications), but the gate covers only the
    packages that Docker Scout indexes. On 2026-10-10 the user decided to record this
    gap and keep this item open. Step 3.9 stays done with the gap recorded. The item
    blocks step 4.9, because that step checks the order, ledger and order producer
    images with the same script and the same JRE base. Close it only when a check
    covers every package of the base image and a review handles the OSV advisories
    above.
- id: HOST-RUNTIME-UPDATE
  blocks:
  - '1.1'
  status: resolved
  finding: Docker Desktop 4.69.0 differed from selected 4.92.0.
  resolution: Checksum-verified official installer updated the host to 4.92.0; signed
    app and running engine verified. Runtime component versions are recorded under
    tools.docker_desktop. This clears the version mismatch only; the bundled
    containerd advisory is tracked under SBOM-AND-RUNTIME.
