      reader against a PostgreSQL container and apply the catalog stream with the Flyway Java API. No application
      package contains these artifacts
    reason: PLAN step 3.10 moves the Python checks of Java behavior into Maven integration tests with Testcontainers;
      the user selected a Cucumber test module, as in the other projects of the repository
    verification: The 39 artifacts that no other ShardShop module resolves match Maven Central SHA-1 files; SHA-256
      independently calculated. The imported cucumber-bom 8.0.4 replaces the version ranges that the Cucumber
      libraries declare for each other
    explicit_versions:
      flyway: 13.8.1 instead of the platform's 12.0.0, the release of the lab's Flyway image; the CockroachDB
        plugin is excluded, as in the image
      cucumber: 8.0.4 through cucumber-bom; the repository root keeps 7.34.6 for its other modules
