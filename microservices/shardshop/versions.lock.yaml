maven:
  version_policy: Explicit GA plugin pins; exclude metadata entries for Maven 4 beta
    plugins and framework milestones, except the three qualified Quarkus plugin XML libraries. Install/deploy are pinned lifecycle plugins, not
    authorization to publish artifacts.
  runtime_qualification: On 2026-10-04 six independent Quarkus 3.40.1 clean verify
    builds with integration/audit passed on Maven 3.9.16 / OpenJDK 25; 62 unit/startup
    tests and 10 packaged startup ITs pass with 100% line coverage. Effective graphs
    and SBOMs contain no Spring runtime/test artifacts. Plugin XML prereleases are
    the exact qualified exception below; unused goals remain unqualified.
  review_qualification:
    checked_on: '2026-10-06'
    milestone: '3.3'
    build: The three core libraries and all six applications pass clean verify with audit; 100% line and branch coverage, no warnings. Compile probes reject generator and shared configuration use in ledger and workloads; dependency enforcement rejects optional idgen dependencies and the former optional Snowflake dependency in common. Idgen's separate rules reject common and sharding through direct, optional and transitive dependencies in six negative fixtures.
    unit_startup_tests: 215
    packaged_startup_tests: 40
    sbom_components:
      shardshop-common: 14
      shardshop-idgen: 143
      shardshop-sharding: 141
      shardshop-product: 144
      shardshop-order: 144
      shardshop-ledger: 141
      shardshop-product-seeder: 141
      shardshop-product-reader: 141
      shardshop-order-producer: 141
    dependency_change: The shardshop-core POM groups common, idgen and sharding. Common supplies validation and hashing to all six applications and sharding. Idgen owns the generator, Snowflake 0.0.2 dependency and ID configuration/producer; sharding owns routing and its configuration/producer. Their tests and beans.xml files stay with each library. Only product/order consume idgen and sharding, and neither library depends on the other. Common and idgen use Mockito in tests; no application runtime contains Mockito. Common, sharding, ledger and workloads contain no generator classes or Snowflake dependency. Plugin startup agents remain.
  dataset_qualification:
    checked_on: '2026-10-07'
    milestone: '3.5'
    build: All six applications, three core libraries and the workload dataset library pass the scoped clean verify with audit; 100% line and branch coverage across ten Java modules, no warnings
    unit_client_startup_tests: 559
    packaged_startup_tests: 48
    retained_datasets: catalog-v1 and buyers-v1; 50 company sellers, 100 described/costed products and 1000 person buyers per region; EU27 addresses and 250 buyers each in CN, VN, KR and JP; both datasets remain the initial unreleased v1
    dataset_evidence: shardshop-workload/shardshop-datasets/source-manifest.json pins source and retained resource hashes; SOURCES.md documents ranking limitations and public-domain US Census, CC BY 4.0 Onomaverse and MIT Faker name sources; source notices and licenses are packaged in the dataset JAR
    fixture_checks: All 150 seller, 300 product and 3000 buyer creation payloads pass API schemas; name/email correspondence, region coverage, unique emails at reserved example domains, shared fictional NANPA phone numbers and stable regeneration hashes pass
    client_checks: Mocked HTTP tests verify ID-free POST payloads, stable retry keys across client restarts, unchanged service-returned IDs above 2^53, creation-key lookups, parent bindings and bounded strict JSON transport; rejected responses retain status and optional validated error code without response text, including malformed error bodies; providers remain planned in steps 3.6 and 4.1
    contract_checks: Two OpenAPI documents, 64 inline examples, 51 response examples, two message schemas, three message examples and 424 boundary cases pass; packaged contracts match sources
    sbom_components:
      shardshop-common: 16
      shardshop-idgen: 143
      shardshop-sharding: 143
      shardshop-ledger: 143
      shardshop-order: 146
      shardshop-product: 146
      shardshop-datasets: 13
      shardshop-order-producer: 147
      shardshop-product-reader: 147
      shardshop-product-seeder: 147
    boundaries: Only workload application packages contain shardshop-datasets; services and core contain no dataset classes/resources. Direct, optional and transitive dataset dependency probes are rejected outside workloads. Workload and ledger packages contain no idgen, sharding or Snowflake JAR; no REST extension, Vert.x, Netty or Mockito runtime is packaged
