      jna: 5.8.0 (2021-03-22) is the platform version; docker-java declares 5.18.1, and 5.19.1 (2026-06-12) is the
        newest release. No override until a Quarkus patch moves it. OSV lists no advisory on 2026-10-12
      flyway: 13.8.1 equals the migration image; Flyway publishes no fixed EOL. OSV lists no advisory on
        2026-10-12. Review with the image by 2026-10-30
      cucumber: 8.0.4 (2026-10-02) is the newest release; the 8.0 line needs Java 17 and JUnit Platform 6.1. OSV
        lists no advisory for the 23 Cucumber artifacts on 2026-10-12
      picocontainer: 2.16 (2026-08-15) is the newest release. OSV lists no advisory on 2026-10-12
      junit_platform_suite: 6.1.3, the JUnit family of the platform. OSV lists no advisory on 2026-10-12
      duct_tape_and_annotations: duct-tape 1.0.8 and JetBrains annotations 26.1.0 come with Testcontainers. OSV
        lists no advisory on 2026-10-12
