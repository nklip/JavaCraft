  policy: Community LTS where available; otherwise compatible maintained GA with regular
    upgrades.
  verification: Official release metadata, support matrices, OCI manifests/configs,
    and Maven artifacts checked. Six module builds, unit/integration configuration
    and executed plugin goals qualified in step 0.3.
    OpenJDK container build/runtime smoke checks passed. No cluster or signature
    verification performed.
  date_inheritance: Unless overridden, entries use checked_on/review_by above; support_refs
    resolve into support_policies and source_refs into sources.
  inventory_boundary: The audit Maven profile writes effective POMs, application/test
    dependency trees, plugin classpaths and SBOMs to each application's target/audit.
    Shaded contents, general dynamic providers, Maven/JDK bundled libraries and
    image OS packages remain outside this Maven inventory.
  pin_usage: Use digest references for images, never tag alone. Artifact hashes are
    inventory evidence, not build-time checks; the ShardShop POMs carry the selected
    Maven versions.
  image_verification: Downloaded raw OCI index, linux/arm64 manifest and config; independently
    recomputed all three SHA-256 digests. Selected OpenJDK layers were pulled for
    native ARM64 checks; other image layers and infrastructure runtime remain unqualified.
  selection_status: Selected Maven pins are applied only to ShardShop. Infrastructure
    remains undeployed. Historical step 0.1 artifact evidence is in VERSIONS.md.
