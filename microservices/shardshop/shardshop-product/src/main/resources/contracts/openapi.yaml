openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ShardShop Product API
  version: 1.0.0
  description: |
    Contract owned by shardshop-product. Clients own their DTOs and JSON handling;
    this document and its schemas are not shared runtime artifacts. This contract
    describes the planned HTTP implementation, not the current application skeleton.

    Product issues immutable seller and product fixtures through version-pinned
    dataset discovery. Clients forward those IDs and creationPayload values
    unchanged, including after lost responses or restarts; they never derive IDs.
    A syntactically valid ID is not proof that product issued it. Creation accepts
    only product-issued IDs for the addressed entity and parent.

    All IDs are canonical ASCII decimal strings in 1..9223372036854775807. Reject
    numeric JSON tokens, signs, zero, leading zeroes, whitespace, fractions,
    exponents and overflow without coercion, before IO or routing. Seller IDs
    select placement internally. There is no public shard selector, read-profile
    selector, or independent product region. Sellers have an immutable issued
    home region; products inherit their seller's region.

    JSON object member order is immaterial. Values are compared without trimming,
    case folding or Unicode normalization. Unknown JSON properties, duplicate
    object member names, unknown/repeated query parameters and malformed bodies
    are INVALID_REQUEST. Requests use application/json. Price is a nonnegative
    fixed-two-decimal string, avoiding JSON floating-point rounding. Currency is
    exactly three uppercase ASCII letters; region does not select currency.
    Names contain Unicode scalar values, excluding NUL and unpaired UTF-16
    surrogates; a valid surrogate pair decodes to one scalar value. Invalid text
    is 400 before IO. Integer fields accept exact integral JSON values: 2, 2.0
    and 2e0 normalize to integer 2. Fractional values such as 2.5, booleans,
    numeric strings and values outside the bounds are 400. Parse exactly before
    checking the range; never truncate or round through binary floating point.

    Resource PUTs always use a primary and commit before reporting success. A
    timeout or unknown commit returns CATALOG_UNAVAILABLE; retry the same path and
    creation payload with bounded backoff. GETs use primaries by default. The
    optional deployment-level replica profile may return stale values or a 404
    for a write not yet replayed. It never falls back to a primary: replica
    unavailability returns READ_REPLICA_UNAVAILABLE, never a false 404. The full
    database phase, including pool acquisition, connection setup, queries and
    retries, has a three-second budget within a four-second server deadline.
    Reader clients use a five-second overall deadline, including bounded retries.

    Dataset paths, page fields, version tokens, cursor format, price text and
    strict object validation are local wire choices established by this contract.
    Examples demonstrate the wire format; fixture issuance is established only
    by a configured dataset response, not by copying an example ID.
servers:
  - url: /
tags:
  - name: Datasets
  - name: Sellers
  - name: Products
paths:
  /api/v1/datasets/{datasetVersion}/sellers:
    parameters:
      - $ref: '#/components/parameters/DatasetVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    get:
      tags: [Datasets]
      operationId: listSellerFixtures
      summary: Discover one immutable seller fixture page
      description: |
        Returns descriptors whether or not the sellers have been created. Reading
        a descriptor does not create a seller. Pin datasetVersion for the entire
        run; there is no mutable latest alias. Enumerate in ascending numeric
        sellerId order, preserving the returned text exactly. A version's members,
        order, IDs and creationPayload values never change. Future versions may
        select subsets but cannot assign a new payload to any retained ID.

        Omit cursor for the first page; follow nextCursor until it is absent.
        Cursors bind the version, collection and continuation position, are opaque
        to clients, and remain valid while that version is retained. Changing
        limit between pages is allowed. A continuation never repeats or skips an
        item. Malformed or wrong-version/wrong-collection cursors return 400.
        A syntactically valid but unknown version returns 404. Dataset discovery
        uses the service-owned immutable configuration, not live catalog stock.
      responses:
        '200':
          description: Up to limit immutable seller descriptors; empty items marks an empty or exhausted page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerFixturePage'
              examples:
                terminalPage:
                  value:
                    datasetVersion: catalog-v1
                    items:
                      - sellerId: '11234023833600000'
                        creationPayload:
                          name: Asia Market
                          region: ASIA
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/DatasetNotFound'
        '503':
          $ref: '#/components/responses/GenerationUnavailable'
  /api/v1/datasets/{datasetVersion}/products:
    parameters:
      - $ref: '#/components/parameters/DatasetVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    get:
      tags: [Datasets]
      operationId: listProductFixtures
      summary: Discover one immutable product fixture page
      description: |
        Returns each product's sellerId, productId and exact PUT creationPayload,
        whether or not that seller/product has been created. Discovery does not
        create resources. Products carry no independent region field: obtain the
        seller's immutable region from the seller descriptors for the same pinned
        version. USD and EUR fixtures exist in every region; region and currency
        are independent.

        Enumerate in ascending numeric (sellerId, productId) order. The version's
        membership, order, relationships and payloads are immutable. Discovery
        always returns initialStock, never a live stock snapshot. Future versions
        may select subsets without reassigning an existing ID or changing its
        payload. Omit cursor initially; otherwise forward the opaque nextCursor
        unchanged. Cursors bind version, collection and position and remain valid
        while the version is retained; limit may change. No item is skipped or
        repeated. Missing nextCursor means complete. Malformed/mismatched cursors
        return 400; a syntactically valid unknown version returns 404.
      responses:
        '200':
          description: Up to limit immutable product descriptors; empty items marks an empty or exhausted page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFixturePage'
              examples:
                continuedPage:
                  value:
                    datasetVersion: catalog-v1
                    items:
                      - sellerId: '11234023833600000'
                        productId: '11234023837794304'
                        creationPayload:
                          name: Travel mug
                          price: '19.95'
                          currency: EUR
                          initialStock: 10
                    nextCursor: eyJwb3NpdGlvbiI6MX0
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/DatasetNotFound'
        '503':
          $ref: '#/components/responses/GenerationUnavailable'
  /api/v1/sellers/{sellerId}:
    parameters:
      - $ref: '#/components/parameters/SellerId'
    put:
      tags: [Sellers]
      operationId: putSeller
      summary: Create a service-issued immutable seller or retry its creation
      description: |
        Validate syntax, ID issuance and the issued home region before IO. An
        unissued/wrong-entity ID or missing, unknown or mismatched region returns
        400, including on a retry. A caller cannot choose the region. Then compare
        an existing seller with its stored creation payload: equal values return
        200; a different name returns 409 SELLER_ID_CONFLICT without mutation.
        For an absent seller, require the issued fixture's exact creationPayload
        (otherwise 400), insert it on the seller's primary and return 201 after
        commit. Concurrent identical calls create one seller. A lost response is
        retried with the same ID and values, never a newly constructed ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeller'
            example:
              name: Asia Market
              region: ASIA
      responses:
        '201':
          description: Seller committed for the first time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seller'
              example:
                sellerId: '11234023833600000'
                name: Asia Market
                region: ASIA
        '200':
          $ref: '#/components/responses/SellerOk'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: This issued ID already has a different immutable seller creation payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      code:
                        const: SELLER_ID_CONFLICT
              example:
                code: SELLER_ID_CONFLICT
                message: Seller ID already has a different creation payload.
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
    get:
      tags: [Sellers]
      operationId: getSeller
      summary: Read a seller by its canonical ID
      description: |
        Validate the ID before IO. Return the stored seller or SELLER_NOT_FOUND.
        GET does not require an issued fixture mapping: a canonical absent ID is
        a 404. The configured replica profile may return temporarily missing
        data, but an unavailable selected store returns 503, not 404.
      responses:
        '200':
          $ref: '#/components/responses/SellerOk'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/SellerNotFound'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
  /api/v1/sellers/{sellerId}/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/SellerId'
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Products]
      operationId: putProduct
      summary: Create a service-issued product or retry its creation
      description: |
        Validate IDs, payload syntax and issued seller/product association before
        IO. An unissued/wrong-entity ID or product addressed under another seller
        is 400 INVALID_REQUEST, not a conflicting reuse. Products inherit the
        issued seller's placement; a region or shard property is invalid.

        Compare an existing product against its stored creation payload (name,
        price, currency and initialStock). Identical values return 200; different
        values return 409 PRODUCT_ID_CONFLICT. Current stock is never compared
        and never reset by a retry, even after reservations reduce it. The 200
        response includes the current stock read from the primary.

        For an absent product, require the fixture's exact creationPayload
        (otherwise 400), then require the seller on its reachable primary
        (otherwise 422 SELLER_NOT_FOUND). Insert with stock = initialStock on that
        seller's primary and return 201 after commit. Concurrent identical calls
        create one product. Store unavailability or an unknown commit returns
        503, never a missing-seller result. Retry the exact path and creation
        values. No HTTP operation restocks a product or changes its stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
            example:
              name: Travel mug
              price: '19.95'
              currency: EUR
              initialStock: 10
      responses:
        '201':
          description: Product committed for the first time; stock equals initialStock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                sellerId: '11234023833600000'
                productId: '11234023837794304'
                name: Travel mug
                price: '19.95'
                currency: EUR
                initialStock: 10
                stock: 10
        '200':
          $ref: '#/components/responses/ProductOk'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: This issued ID already has a different immutable product creation payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      code:
                        const: PRODUCT_ID_CONFLICT
              example:
                code: PRODUCT_ID_CONFLICT
                message: Product ID already has a different creation payload.
        '422':
          $ref: '#/components/responses/SellerNotFound'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Read a product and its current stock under its seller
      description: |
        Validate both IDs before IO. Return the product stored under this seller,
        including current stock, or 404 PRODUCT_NOT_FOUND. A canonical pair that
        is absent or names another seller's product is a 404; GET does not perform
        creation-issuance validation. The configured replica profile may return
        stale stock or temporarily missing data. Unavailability returns 503,
        never 404, and replicas never fall back to primaries.
      responses:
        '200':
          $ref: '#/components/responses/ProductOk'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: No product is visible under the addressed seller on the selected reachable store.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - properties:
                      code:
                        const: PRODUCT_NOT_FOUND
              example:
                code: PRODUCT_NOT_FOUND
                message: Product was not found under this seller.
        '503':
          $ref: '#/components/responses/ReadUnavailable'
components:
  parameters:
    SellerId:
      name: sellerId
      in: path
      required: true
      description: Product-issued seller ID for PUT; canonical ID for GET. Never a shard selector.
      schema:
        $ref: '#/components/schemas/Id'
      example: '11234023833600000'
    ProductId:
      name: productId
      in: path
      required: true
      description: Product-issued ID belonging to the path seller for PUT; canonical ID for GET.
      schema:
        $ref: '#/components/schemas/Id'
      example: '11234023837794304'
    DatasetVersion:
      name: datasetVersion
      in: path
      required: true
      description: Exact immutable configuration version; pin it across discovery, seeding and workload restarts.
      schema:
        $ref: '#/components/schemas/DatasetVersion'
      example: catalog-v1
    Limit:
      name: limit
      in: query
      description: Maximum descriptors in this page. May change while following a cursor.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    Cursor:
      name: cursor
      in: query
      description: Omit initially; otherwise send the returned opaque continuation token unchanged.
      schema:
        $ref: '#/components/schemas/Cursor'
  responses:
    SellerOk:
      description: Stored seller; a PUT response confirms an identical creation retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Seller'
          example:
            sellerId: '11234023833600000'
            name: Asia Market
            region: ASIA
    ProductOk:
      description: Stored product with current stock; a PUT response confirms an identical creation retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Product'
          example:
            sellerId: '11234023833600000'
            productId: '11234023837794304'
            name: Travel mug
            price: '19.95'
            currency: EUR
            initialStock: 10
            stock: 7
    InvalidRequest:
      description: Invalid input, issuance, parent, region, fixture payload, version token or cursor; correct the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  code:
                    const: INVALID_REQUEST
          example:
            code: INVALID_REQUEST
            message: Request does not match the issued fixture or input contract.
    DatasetNotFound:
      description: A syntactically valid requested dataset version is not configured.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  code:
                    const: DATASET_NOT_FOUND
          example:
            code: DATASET_NOT_FOUND
            message: Dataset version was not found.
    SellerNotFound:
      description: Seller is absent on the reachable primary for a product PUT, or not visible on the selected reachable store for a seller GET.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  code:
                    const: SELLER_NOT_FOUND
          example:
            code: SELLER_NOT_FOUND
            message: Seller was not found.
    GenerationUnavailable:
      description: Fixture generation unavailable; retry the same dataset version and cursor with bounded backoff.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  code:
                    const: ID_GENERATION_UNAVAILABLE
          example:
            code: ID_GENERATION_UNAVAILABLE
            message: Fixture generation is temporarily unavailable; retry the same page.
    CatalogUnavailable:
      description: Catalog primary is unavailable, its bounded IO timed out, or commit outcome is unknown. Retry with the same IDs and payload within a bounded backoff budget.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  code:
                    const: CATALOG_UNAVAILABLE
          example:
            code: CATALOG_UNAVAILABLE
            message: Catalog is temporarily unavailable; retry the same request.
    ReadUnavailable:
      description: The selected catalog primary or replica is unavailable or timed out. Replica reads never fall back to a primary. Return within the four-second server deadline.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - properties:
                  code:
                    enum: [CATALOG_UNAVAILABLE, READ_REPLICA_UNAVAILABLE]
          examples:
            primary:
              value:
                code: CATALOG_UNAVAILABLE
                message: Catalog primary is temporarily unavailable.
            replica:
              value:
                code: READ_REPLICA_UNAVAILABLE
                message: Catalog read replica is temporarily unavailable.
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 19
      description: |
        Canonical ASCII decimal text in 1..9223372036854775807, including IDs
        above 2^53. The alternatives bound 19-digit values to the signed-long
        maximum. The final negative lookahead asserts the true end of the string,
        rejecting LF/CRLF suffixes as well as all other non-digit text. Do not
        trim, parse JSON numbers, round through floating point or coerce input.
      pattern: '^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[01][0-9]{17}|92[01][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[01][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7])(?![\s\S])'
      examples: ['1', '11234023833600000', '9223372036854775807']
    Name:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^(?=[\s\S]*\S)(?:[^\u0000\uD800-\uDFFF]|[\uD800-\uDBFF][\uDC00-\uDFFF])+(?![\s\S])'
      description: Nonblank name of at most 200 Unicode scalar values, excluding NUL and unpaired surrogates; preserve the issued text exactly.
    Region:
      type: string
      enum: [US, EU, ASIA]
      description: Immutable home region issued by product from the seller's ID route, never a caller choice.
    Price:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,16})\.[0-9]{2}(?![\s\S])'
      description: Canonical nonnegative NUMERIC(19,2), from 0.00 through 99999999999999999.99. No sign, leading zeroes, exponent, grouping or rounding.
      examples: ['0.00', '19.95', '99999999999999999.99']
    Currency:
      type: string
      pattern: '^[A-Z]{3}(?![\s\S])'
      description: Three uppercase ASCII letters; USD and EUR fixtures occur in every region.
      examples: [USD, EUR]
    Stock:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
      description: Nonnegative PostgreSQL INTEGER count. Exact integral JSON values 2, 2.0 and 2e0 normalize to 2; strings and fractional values such as 2.5 are invalid.
    CreateSeller:
      type: object
      additionalProperties: false
      required: [name, region]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        region:
          $ref: '#/components/schemas/Region'
    Seller:
      type: object
      additionalProperties: false
      required: [sellerId, name, region]
      properties:
        sellerId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        region:
          $ref: '#/components/schemas/Region'
    CreateProduct:
      type: object
      additionalProperties: false
      required: [name, price, currency, initialStock]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        price:
          $ref: '#/components/schemas/Price'
        currency:
          $ref: '#/components/schemas/Currency'
        initialStock:
          $ref: '#/components/schemas/Stock'
      description: Exact issued immutable payload. IDs belong in the path; region is inherited and stock is service-managed.
    Product:
      type: object
      additionalProperties: false
      required: [sellerId, productId, name, price, currency, initialStock, stock]
      description: |
        Initial stock is immutable; current stock is changed only by order saga
        reservations/releases. The service and database enforce stock <=
        initialStock, a cross-property rule not expressible in standard JSON
        Schema. PUT retries compare initialStock and never reset current stock.
      properties:
        sellerId:
          $ref: '#/components/schemas/Id'
        productId:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        price:
          $ref: '#/components/schemas/Price'
        currency:
          $ref: '#/components/schemas/Currency'
        initialStock:
          $ref: '#/components/schemas/Stock'
        stock:
          $ref: '#/components/schemas/Stock'
    DatasetVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}(?![\s\S])'
      description: Case-sensitive immutable dataset token; not an ID or a mutable latest alias.
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[A-Za-z0-9_-]+(?![\s\S])'
      description: Opaque unpadded base64url continuation token. Clients must not decode, construct or modify it.
    SellerFixture:
      type: object
      additionalProperties: false
      required: [sellerId, creationPayload]
      properties:
        sellerId:
          $ref: '#/components/schemas/Id'
        creationPayload:
          $ref: '#/components/schemas/CreateSeller'
    ProductFixture:
      type: object
      additionalProperties: false
      required: [sellerId, productId, creationPayload]
      properties:
        sellerId:
          $ref: '#/components/schemas/Id'
        productId:
          $ref: '#/components/schemas/Id'
        creationPayload:
          $ref: '#/components/schemas/CreateProduct'
    SellerFixturePage:
      type: object
      additionalProperties: false
      required: [datasetVersion, items]
      properties:
        datasetVersion:
          $ref: '#/components/schemas/DatasetVersion'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SellerFixture'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      description: Echoes the requested version. Item count is at most the requested limit; nextCursor exists only if more items remain and is omitted, never null, at completion.
    ProductFixturePage:
      type: object
      additionalProperties: false
      required: [datasetVersion, items]
      properties:
        datasetVersion:
          $ref: '#/components/schemas/DatasetVersion'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProductFixture'
        nextCursor:
          $ref: '#/components/schemas/Cursor'
      description: Echoes the requested version. Item count is at most the requested limit; nextCursor exists only if more items remain and is omitted, never null, at completion.
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - DATASET_NOT_FOUND
            - SELLER_ID_CONFLICT
            - PRODUCT_ID_CONFLICT
            - SELLER_NOT_FOUND
            - PRODUCT_NOT_FOUND
            - CATALOG_UNAVAILABLE
            - READ_REPLICA_UNAVAILABLE
            - ID_GENERATION_UNAVAILABLE
        message:
          type: string
          minLength: 1
      description: Stable machine-readable code and human-readable message. Clients branch on code; message text may change and must not disclose credentials, SQL or internal endpoints.
